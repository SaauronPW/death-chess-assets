name: Inspect Death Chess Assets

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip imagemagick

      - name: Unzip death chess.zip
        run: |
          if [ ! -f "death chess.zip" ]; then
            echo "death chess.zip not found in repository root"
            ls -la
            exit 1
          fi
          rm -rf unpacked thumbnails || true
          mkdir -p unpacked thumbnails
          unzip -o "death chess.zip" -d unpacked

      - name: Find images and generate thumbnails
        run: |
          find unpacked -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' -o -iname '*.svg' \) > all_images.txt || true
          echo "Found images:"; cat all_images.txt || true

          echo "Generating thumbnails (256x256)..."
          while IFS= read -r img; do
            if [ -z "$img" ]; then continue; fi
            base=$(basename "$img")
            out="thumbnails/${base%.*}.png"
            # Use ImageMagick convert to create a centered thumbnail
            convert "$img" -thumbnail 256x256^ -gravity center -extent 256x256 "$out" || echo "convert failed for $img"
          done < all_images.txt

          echo "Collecting file information..."
          printf "Filename\tSize(bytes)\tResolution/Format\n" > file-list.txt
          while IFS= read -r img; do
            if [ -z "$img" ]; then continue; fi
            size=$(stat -c%s "$img" 2>/dev/null || stat -f%z "$img" 2>/dev/null || echo 0)
            info=$(identify -format "%w x %h, %m" "$img" 2>/dev/null || echo "unknown")
            printf "%s\t%s\t%s\n" "$img" "$size" "$info" >> file-list.txt
          done < all_images.txt

      - name: Zip thumbnails
        run: |
          if [ -d thumbnails ]; then
            zip -r thumbnails.zip thumbnails || true
          else
            echo "No thumbnails generated"
          fi

      - name: Upload thumbnails artifact
        uses: actions/upload-artifact@v4
        with:
          name: thumbnails
          path: |
            thumbnails.zip
            thumbnails

      - name: Upload file list artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-list
          path: file-list.txt

      - name: Done
        run: |
          echo "Asset inspection complete. Artifacts: thumbnails.zip and file-list.txt"